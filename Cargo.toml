[package]
name = "raytracer"
version = "0.1.0"
edition = "2021"
description = "Учебный трассировщик лучей на чистом Rust (вывод в PPM P3)"

# Внешних зависимостей нет: вся математика и многопоточность — на std.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
